name: Catchup IG Au Gratin reel 08-28 (temp)

on:
  workflow_dispatch:

env:
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
      - name: Write .env
        run: |
          cat > .env <<EOF
          FB_PAGE_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN"
          FB_PAGE_ID="$FB_PAGE_ID"
          IG_BUSINESS_ID="$IG_BUSINESS_ID"
          EOF
      - name: Write caption
        run: |
          cat > caption.txt <<'CAPEOF'
          ✨ Hoje tem salmão fresco e rabada esperando por você no nosso buffet! Chega, monte seu prato à vontade e aproveite.

          📍 Rua Amador Bueno, 771 – Santo Amaro
          ⏰ Segunda a sexta, das 11h às 15h

          #restaurantesantoamaro #selfservicesp #comidacaseira #buffetsp #almocoespecial
          CAPEOF
      - name: Resolve URL and post to Instagram
        run: |
          video_url=$(python3 scripts/resolve_drive_url.py "Augratin edit salmao e pista.mp4" "1M1htkZCYP1xtz0Nk3p4_lhS61kOIRGtY")
          echo "URL: $video_url"
          bash scripts/post_reel_instagram.sh caption.txt "$video_url"
